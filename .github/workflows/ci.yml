name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Test, Lint and Verify Distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json
          tools: php-cs-fixer

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci


      - name: PHP syntax lint
        run: |
          for f in src/*.php scripts/*.php; do
            php -l "$f"
          done

      - name: Run cities monitoring self-test & fixtures
        run: |
          php scripts/check-cities.php --self-test
          php scripts/check-cities.php --fixtures

      - name: Run full test suite
        run: npm test

      - name: Verify build script & sync
        run: |
          bash scripts/build.sh
          git diff --exit-code dist/
