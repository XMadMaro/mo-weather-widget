name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Terser
        run: npm install -g terser

      - name: Build distribution assets
        run: bash scripts/build.sh

      - name: Verify JavaScript syntax
        run: node --check dist/weather-widget.min.js

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/weather-widget.min.js
            dist/weather-widget.js
            dist/weather-api.php
          generate_release_notes: true
          draft: false
          prerelease: false
