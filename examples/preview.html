<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MO Weather Widget v2.0 — Podgląd do zrzutów ekranu</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    background: #f1f3f5;
    color: #1a1a1a;
  }
  body.dark-mode {
    background: #090a0c;
    color: #f4f4f5;
  }
  .card-wrap {
    width: 100%;
    max-width: 680px;
  }
  .card-wrap.wide {
    max-width: 1100px;
  }
  .header-tag {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: #495057;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dark-mode .header-tag {
    color: #adb5bd;
  }
  .dark-mode .dark-box {
    --mo-card: #17181c;
    --mo-text: #f4f4f5;
    --mo-muted: #9ca3af;
    --mo-border: #2b2d33;
    --mo-accent: #6ab0ff;
    --mo-bg-sub: #24262d;
    --mo-foot: #9ca3af;
    --mo-stale-bg: #2e2612;
    --mo-stale-text: #ffe082;
    --mo-stale-border: #4d3a17;
    --mo-nowcast-active-bg: #142a42;
    --mo-nowcast-active-text: #90caf9;
    --mo-nowcast-active-border: #1e3a5f;
    --mo-aqi1-bg: #13381e; --mo-aqi1-text: #a3e9b6;
    --mo-aqi2-bg: #163d22; --mo-aqi2-text: #b7e4c7;
    --mo-aqi3-bg: #3d3012; --mo-aqi3-text: #ffe082;
    --mo-aqi4-bg: #3e2415; --mo-aqi4-text: #ffcc80;
    --mo-aqi5-bg: #421818; --mo-aqi5-text: #ef9a9a;
    --mo-aqi6-bg: #2e1642; --mo-aqi6-text: #ce93d8;
    --mo-aqi0-bg: #24262d; --mo-aqi0-text: #9ca3af;
    background: #17181c;
    border-radius: 12px;
    padding: 4px;
    border: 1px solid #2b2d33;
  }
</style>
<script src="../dist/weather-widget.js" defer></script>
</head>
<body>

<div id="app" class="card-wrap"></div>

<script>
  (function () {
    var params = new URLSearchParams(location.search);
    var view = params.get('view') || 'light';
    var app = document.getElementById('app');

    if (view === 'light') {
      document.title = 'MO Weather Widget — Tryb Jasny';
      app.innerHTML =
        '<div class="header-tag">MEDIA OPERATOR · TRYB JASNY (KATOWICE — CURRENT, AIR GIOŚ, 7 DNI, NOWCAST)</div>' +
        '<mo-weather mode="single" city-id="katowice" modules="current,air,daily7,nowcast" api-url="../dist/weather-api.php"></mo-weather>';
    } else if (view === 'dark') {
      document.body.classList.add('dark-mode');
      document.title = 'MO Weather Widget — Tryb Ciemny (Wysoki Kontrast WCAG AAA)';
      app.innerHTML =
        '<div class="header-tag">MEDIA OPERATOR · TRYB CIEMNY (KATOWICE — WYSOKI KONTRAST WCAG AAA)</div>' +
        '<div class="dark-box">' +
        '  <mo-weather mode="single" city-id="katowice" modules="current,air,daily7,nowcast" api-url="../dist/weather-api.php"></mo-weather>' +
        '</div>';
    } else if (view === 'aggregator') {
      document.title = 'MO Weather Widget — Agregator Miast';
      app.classList.add('wide');
      app.innerHTML =
        '<div class="header-tag">MEDIA OPERATOR · AGREGATOR WIELU MIAST Z JAKOŚCIĄ POWIETRZA (KARUZELA A11Y)</div>' +
        '<mo-weather mode="aggregator" cities="katowice,gliwice,sosnowiec,zabrze,tychy,bytom" modules="current,air" api-url="../dist/weather-api.php"></mo-weather>';
    }
  })();
</script>
</body>
</html>
