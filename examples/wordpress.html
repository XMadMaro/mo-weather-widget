<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WordPress Embed Example — MO Weather Widget</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f0f1; margin: 24px; color: #1d2327; }
    .wp-block-post-content { max-width: 680px; margin: 0 auto; background: #fff; padding: 32px; border: 1px solid #c3c4c7; border-radius: 4px; }
    h1 { font-size: 24px; margin-top: 0; }
    .wp-block-custom-html { margin: 24px 0; }
  </style>
  <script src="../dist/weather-widget.js" defer></script>
</head>
<body>
  <article class="wp-block-post-content">
    <h1>Wiadomości Regionalne — WordPress Gutenberg Embed</h1>
    <p>Poniżej osadzono komponent za pomocą standardowego bloku <strong>Własny HTML (Custom HTML)</strong>:</p>

    <!-- KOD WKLEJANY DO BLOKU WORDPRESS -->
    <div class="wp-block-custom-html">
      <mo-weather mode="single" city-id="katowice" api-url="../dist/weather-api.php"></mo-weather>
    </div>

    <p>Widget dzięki Shadow DOM dziedziczy podstawową typografię, zachowując nienaruszone style motywu WordPress.</p>
  </article>
</body>
</html>
